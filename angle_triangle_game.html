<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shape Classifier Game — Year 7 Maths</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f3;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
.container{width:100%;max-width:680px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.header-title{font-size:15px;font-weight:600;color:#1a1a1a}
.mode-pills{display:flex;gap:6px}
.pill{padding:6px 14px;font-size:13px;border:1px solid #ccc;border-radius:999px;cursor:pointer;color:#555;background:transparent;transition:all .15s}
.pill.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.stats-row{display:flex;gap:10px;margin-bottom:1.5rem}
.stat{flex:1;background:#fff;border-radius:8px;padding:10px 14px;text-align:center;border:1px solid #e5e5e5}
.stat-n{font-size:22px;font-weight:600;color:#1a1a1a}
.stat-l{font-size:11px;color:#888;letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.progress-bar{height:4px;background:#e5e5e5;border-radius:2px;overflow:hidden;margin-bottom:1.5rem}
.progress-fill{height:100%;background:#1a1a1a;border-radius:2px;transition:width .3s}
.arena{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:2rem;margin-bottom:1rem;min-height:240px;display:flex;flex-direction:column;align-items:center;gap:1.5rem}
.shape-canvas{width:200px;height:160px}
.question{font-size:18px;font-weight:600;color:#1a1a1a;text-align:center}
.hint{font-size:13px;color:#888;text-align:center;min-height:18px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;width:100%}
.choice-btn{padding:10px 14px;font-size:14px;border:1px solid #ccc;border-radius:8px;cursor:pointer;color:#1a1a1a;background:#fff;transition:all .15s;text-align:center}
.choice-btn:hover:not(:disabled){background:#f5f5f3}
.choice-btn.correct{background:#eaf3de;border-color:#639922;color:#27500a}
.choice-btn.wrong{background:#fcebeb;border-color:#a32d2d;color:#791f1f}
.choice-btn:disabled{cursor:default;opacity:.8}
.feedback-bar{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px}
.feedback-text{font-size:14px;font-weight:600;min-height:20px}
.feedback-text.ok{color:#3b6d11}
.feedback-text.bad{color:#a32d2d}
.next-btn{padding:8px 20px;font-size:14px;border:1px solid #ccc;border-radius:8px;cursor:pointer;color:#1a1a1a;background:transparent;display:none}
.next-btn.show{display:block}
.fact-tip{font-size:13px;color:#555;background:#f5f5f3;border-radius:8px;padding:8px 12px;margin-top:4px;line-height:1.5;display:none}
.fact-tip.show{display:block}
.end-screen{display:none;flex-direction:column;align-items:center;gap:1rem;padding:2rem;text-align:center;background:#fff;border:1px solid #e5e5e5;border-radius:12px}
.end-screen.show{display:flex}
.end-title{font-size:24px;font-weight:600;color:#1a1a1a}
.end-score{font-size:48px;font-weight:700;color:#1a1a1a}
.end-sub{font-size:14px;color:#888}
.restart-btn{padding:10px 28px;font-size:15px;border:1px solid #ccc;border-radius:8px;cursor:pointer;background:transparent;color:#1a1a1a}
.restart-btn:hover{background:#f5f5f3}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-title">Shape classifier — Year 7 Maths</div>
    <div class="mode-pills">
      <button class="pill active" onclick="setMode('angles')" id="pill-angles">Angles</button>
      <button class="pill" onclick="setMode('triangles')" id="pill-triangles">Triangles</button>
      <button class="pill" onclick="setMode('mixed')" id="pill-mixed">Mixed</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="stat-n" id="s-score">0</div><div class="stat-l">Score</div></div>
    <div class="stat"><div class="stat-n" id="s-streak">0</div><div class="stat-l">Streak</div></div>
    <div class="stat"><div class="stat-n" id="s-q">1<span style="font-size:14px;color:#888">/10</span></div><div class="stat-l">Question</div></div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>

  <div class="arena" id="arena">
    <svg class="shape-canvas" id="shapesvg" viewBox="0 0 200 160"></svg>
    <div class="question" id="question">What type of angle is shown?</div>
    <div class="hint" id="hint"></div>
    <div class="choices" id="choices"></div>
  </div>

  <div class="fact-tip" id="factTip"></div>

  <div class="feedback-bar">
    <div class="feedback-text" id="feedbackText"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next &#8594;</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="end-title" id="endTitle">Round complete!</div>
    <div class="end-score" id="endScore"></div>
    <div class="end-sub" id="endSub"></div>
    <button class="restart-btn" onclick="restartGame()">&#8635; Play again</button>
  </div>
</div>

<script>
const TOTAL = 10;
const angleItems = [
  {type:'angle',label:'Acute',angle:35,choices:['Acute','Obtuse','Right','Reflex'],fact:'Acute angles are less than 90°. The word "acute" means sharp — these angles look pointy!'},
  {type:'angle',label:'Acute',angle:60,choices:['Acute','Obtuse','Right','Reflex'],fact:'60° is one-third of a right angle. An equilateral triangle has three 60° angles.'},
  {type:'angle',label:'Acute',angle:20,choices:['Acute','Right','Obtuse','Straight'],fact:'At just 20°, this is a very sharp angle — well under 90°.'},
  {type:'angle',label:'Acute',angle:75,choices:['Acute','Right','Obtuse','Reflex'],fact:'75° is three-quarters of a right angle — clearly acute but getting close.'},
  {type:'angle',label:'Right',angle:90,choices:['Acute','Right','Obtuse','Reflex'],fact:'Right angles (90°) get a special square symbol. Every corner of a square or rectangle is a right angle.'},
  {type:'angle',label:'Obtuse',angle:120,choices:['Acute','Right','Obtuse','Reflex'],fact:'Obtuse angles are between 90° and 180°. "Obtuse" means blunt — they look wide and open.'},
  {type:'angle',label:'Obtuse',angle:150,choices:['Right','Obtuse','Straight','Reflex'],fact:'150° is close to a straight line (180°). Its supplement is 30°.'},
  {type:'angle',label:'Obtuse',angle:105,choices:['Acute','Right','Obtuse','Straight'],fact:'Just over 90°, this is clearly obtuse — wider than a right angle.'},
  {type:'angle',label:'Straight',angle:180,choices:['Right','Straight','Obtuse','Reflex'],fact:'A straight angle is exactly 180° — both arms form a flat, straight line.'},
  {type:'angle',label:'Reflex',angle:240,choices:['Obtuse','Straight','Reflex','Right'],fact:'Reflex angles are over 180°. They\'re the "go around the long way" angles.'},
  {type:'angle',label:'Reflex',angle:300,choices:['Straight','Obtuse','Reflex','Acute'],fact:'300° is five-sixths of a full turn. Its non-reflex counterpart is only 60°.'},
  {type:'angle',label:'Acute',angle:45,choices:['Acute','Obtuse','Right','Reflex'],fact:'45° is exactly half a right angle. You see it on the diagonal of a square.'},
  {type:'angle',label:'Obtuse',angle:135,choices:['Acute','Right','Obtuse','Reflex'],fact:'135° + 45° = 180°. These two angles are supplementary.'},
];
const triangleItems = [
  {type:'triangle',label:'Equilateral',pts:[[100,20],[20,145],[180,145]],choices:['Equilateral','Isosceles','Scalene','Right-angled'],fact:'All three sides equal, all angles are 60°. The most symmetrical triangle!'},
  {type:'triangle',label:'Isosceles',pts:[[100,20],[30,145],[170,145]],choices:['Equilateral','Isosceles','Scalene','Right-angled'],fact:'Isosceles triangles have two equal sides and two equal base angles.'},
  {type:'triangle',label:'Isosceles',pts:[[100,15],[50,145],[150,145]],choices:['Equilateral','Isosceles','Scalene','Right-angled'],fact:'The two "legs" are the same length — the two base angles are always equal.'},
  {type:'triangle',label:'Scalene',pts:[[30,20],[170,30],[60,145]],choices:['Equilateral','Isosceles','Scalene','Right-angled'],fact:'Scalene triangles have all three sides different. No sides equal, no angles equal.'},
  {type:'triangle',label:'Scalene',pts:[[20,145],[165,110],[80,20]],choices:['Isosceles','Scalene','Right-angled','Equilateral'],fact:'The word "scalene" means uneven. All three angles are different too.'},
  {type:'triangle',label:'Right-angled',pts:[[20,145],[20,25],[150,145]],choices:['Equilateral','Isosceles','Scalene','Right-angled'],fact:'A right-angled triangle has one 90° angle. The side opposite it is the hypotenuse.'},
  {type:'triangle',label:'Right-angled',pts:[[20,145],[160,145],[160,30]],choices:['Isosceles','Scalene','Right-angled','Equilateral'],fact:'Right-angled triangles are the basis of trigonometry — coming up in Year 9!'},
  {type:'triangle',label:'Isosceles',pts:[[100,20],[40,145],[160,145]],choices:['Equilateral','Isosceles','Scalene','Right-angled'],fact:'A wide isosceles — the apex angle is large but the base angles are equal.'},
  {type:'triangle',label:'Scalene',pts:[[40,30],[170,80],[50,145]],choices:['Isosceles','Scalene','Right-angled','Equilateral'],fact:'Every single side and angle is different — totally irregular.'},
  {type:'triangle',label:'Right-angled',pts:[[20,20],[20,145],[160,145]],choices:['Equilateral','Isosceles','Right-angled','Scalene'],fact:'The right angle is at the bottom-left corner. Notice the small square marker.'},
];

let mode='angles',queue=[],qIdx=0,score=0,streak=0,answered=false;

function setMode(m){
  mode=m;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  document.getElementById('pill-'+m).classList.add('active');
  restartGame();
}
function buildQueue(){
  let pool=mode==='angles'?[...angleItems]:mode==='triangles'?[...triangleItems]:[...angleItems,...triangleItems];
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  queue=pool.slice(0,TOTAL);
}
function normalize(v){const l=Math.sqrt(v[0]*v[0]+v[1]*v[1]);return l>0?[v[0]/l,v[1]/l]:[0,0];}
function drawAngle(svg,deg){
  svg.innerHTML='';
  const cx=50,cy=125,armLen=110;
  const isRight=deg===90,isStraight=deg===180,isReflex=deg>180;
  const arm2X=cx+armLen*Math.cos(-deg*Math.PI/180);
  const arm2Y=cy+armLen*Math.sin(-deg*Math.PI/180);
  let arcSvg='';
  const arcR=36;
  if(isRight){
    arcSvg=`<rect x="${cx}" y="${cy-16}" width="16" height="16" fill="none" stroke="#185FA5" stroke-width="1.5"/>`;
  } else if(!isStraight){
    const a1x=cx+arcR,a1y=cy;
    const a2x=cx+arcR*Math.cos(-deg*Math.PI/180);
    const a2y=cy+arcR*Math.sin(-deg*Math.PI/180);
    arcSvg=`<path d="M ${a1x.toFixed(2)} ${a1y.toFixed(2)} A ${arcR} ${arcR} 0 ${isReflex?1:0} 0 ${a2x.toFixed(2)} ${a2y.toFixed(2)}" fill="none" stroke="#185FA5" stroke-width="1.2"/>`;
  }
  const lx=cx+52*Math.cos(-deg/2*Math.PI/180);
  const ly=cy+52*Math.sin(-deg/2*Math.PI/180);
  svg.innerHTML=`
    <line x1="${cx}" y1="${cy}" x2="${cx+armLen}" y2="${cy}" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${arm2X.toFixed(2)}" y2="${arm2Y.toFixed(2)}" stroke="#185FA5" stroke-width="2" stroke-linecap="round"/>
    ${arcSvg}
    <circle cx="${cx}" cy="${cy}" r="3" fill="#185FA5"/>
    <text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" font-size="12" fill="#888" font-family="system-ui,sans-serif" text-anchor="middle">${deg}°</text>`;
}
function drawTriangle(svg,pts,label){
  const p=pts;
  const pathStr=`M ${p[0][0]} ${p[0][1]} L ${p[1][0]} ${p[1][1]} L ${p[2][0]} ${p[2][1]} Z`;
  let extra='';
  if(label==='Right-angled'){
    for(let i=0;i<3;i++){
      const a=p[(i+1)%3],b=p[i],c=p[(i+2)%3];
      const v1=[a[0]-b[0],a[1]-b[1]],v2=[c[0]-b[0],c[1]-b[1]];
      if(Math.abs(v1[0]*v2[0]+v1[1]*v2[1])<300){
        const v1u=normalize(v1),v2u=normalize(v2),s=13;
        const sq=[[b[0]+v1u[0]*s,b[1]+v1u[1]*s],[b[0]+v1u[0]*s+v2u[0]*s,b[1]+v1u[1]*s+v2u[1]*s],[b[0]+v2u[0]*s,b[1]+v2u[1]*s]];
        extra=`<path d="M ${sq[0][0].toFixed(1)} ${sq[0][1].toFixed(1)} L ${sq[1][0].toFixed(1)} ${sq[1][1].toFixed(1)} L ${sq[2][0].toFixed(1)} ${sq[2][1].toFixed(1)}" fill="none" stroke="#185FA5" stroke-width="1.2"/>`;
        break;
      }
    }
  }
  if(label==='Equilateral'||label==='Isosceles'){
    const tc=label==='Equilateral'?3:2;
    for(let i=0;i<tc;i++){
      const a=p[i],b=p[(i+1)%3],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],l=Math.sqrt(dx*dx+dy*dy),nx=-dy/l*6,ny=dx/l*6;
      extra+=`<line x1="${(mx-nx*0.6).toFixed(1)}" y1="${(my-ny*0.6).toFixed(1)}" x2="${(mx+nx*0.6).toFixed(1)}" y2="${(my+ny*0.6).toFixed(1)}" stroke="#185FA5" stroke-width="1.5"/>`;
    }
  }
  svg.innerHTML=`<path d="${pathStr}" fill="#e6f1fb" stroke="#185FA5" stroke-width="2" stroke-linejoin="round"/>${extra}`;
}
function renderQuestion(){
  answered=false;
  const item=queue[qIdx];
  const svg=document.getElementById('shapesvg');
  document.getElementById('feedbackText').textContent='';
  document.getElementById('feedbackText').className='feedback-text';
  document.getElementById('nextBtn').className='next-btn';
  document.getElementById('factTip').className='fact-tip';
  document.getElementById('s-score').textContent=score;
  document.getElementById('s-streak').textContent=streak;
  document.getElementById('s-q').innerHTML=(qIdx+1)+'<span style="font-size:14px;color:#888">/'+TOTAL+'</span>';
  document.getElementById('prog').style.width=Math.round(qIdx/TOTAL*100)+'%';
  if(item.type==='angle'){drawAngle(svg,item.angle);document.getElementById('question').textContent='What type of angle is this?';document.getElementById('hint').textContent=item.angle+'°';}
  else{drawTriangle(svg,item.pts,item.label);document.getElementById('question').textContent='What type of triangle is this?';document.getElementById('hint').textContent='';}
  const shuffled=[...item.choices].sort(()=>Math.random()-.5);
  const choicesEl=document.getElementById('choices');
  choicesEl.innerHTML='';
  shuffled.forEach(c=>{const btn=document.createElement('button');btn.className='choice-btn';btn.textContent=c;btn.onclick=()=>answer(btn,c,item);choicesEl.appendChild(btn);});
  document.getElementById('endScreen').className='end-screen';
  document.getElementById('arena').style.display='flex';
}
function answer(btn,chosen,item){
  if(answered)return;
  answered=true;
  const correct=chosen===item.label;
  document.querySelectorAll('.choice-btn').forEach(b=>{b.disabled=true;if(b.textContent===item.label)b.classList.add('correct');});
  if(!correct)btn.classList.add('wrong');
  const fb=document.getElementById('feedbackText');
  if(correct){const pts=streak>=2?2:1;score+=pts;streak++;fb.textContent=streak>=3?'On fire! +'+pts+' ('+streak+' in a row)':'Correct! +'+pts;fb.className='feedback-text ok';}
  else{streak=0;fb.textContent='Not quite — it\'s '+item.label+'.';fb.className='feedback-text bad';}
  const ft=document.getElementById('factTip');ft.textContent=item.fact;ft.className='fact-tip show';
  document.getElementById('s-score').textContent=score;
  document.getElementById('s-streak').textContent=streak;
  document.getElementById('nextBtn').className='next-btn show';
}
function nextQuestion(){qIdx++;if(qIdx>=TOTAL)showEnd();else renderQuestion();}
function showEnd(){
  document.getElementById('arena').style.display='none';
  document.getElementById('nextBtn').className='next-btn';
  document.getElementById('feedbackText').textContent='';
  document.getElementById('factTip').className='fact-tip';
  document.getElementById('prog').style.width='100%';
  document.getElementById('s-q').innerHTML=TOTAL+'<span style="font-size:14px;color:#888">/'+TOTAL+'</span>';
  const t=score>=16?'Brilliant work!':score>=10?'Well done!':'Keep practising!';
  const s=score>=16?'You\'re a shape classification star.':score>=10?'You got most of them right.':'Review the notes and try again — you\'ll get there!';
  document.getElementById('endTitle').textContent=t;
  document.getElementById('endScore').textContent=score+' / '+(TOTAL*2);
  document.getElementById('endSub').textContent=s;
  document.getElementById('endScreen').className='end-screen show';
}
function restartGame(){qIdx=0;score=0;streak=0;buildQueue();document.getElementById('arena').style.display='flex';document.getElementById('endScreen').className='end-screen';renderQuestion();}
buildQueue();renderQuestion();
</script>
</body>
</html>
