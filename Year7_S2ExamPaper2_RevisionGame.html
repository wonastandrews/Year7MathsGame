<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Year 7 Exam Paper 2 Revision Game</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: scoreboard strip on top, a 5-column board (one column per skill, points rising down), question opens as a full-screen sheet for projection. */
:root{
  --bg:#eef2ed; --surface:#ffffff; --ink:#13241d; --muted:#56675f; --line:#cfd9d2;
  --accent:#0e6a4e; --on-accent:#ffffff; --accent-soft:#d9ece4;
  --sol:#1546b0; --pts:#c0271d; --gold:#b9820b;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",Calibri,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#18221e; --ink:#e9f0eb; --muted:#9bada4; --line:#2c3a34;
  --accent:#35b88a; --on-accent:#05241a; --accent-soft:#1d3a30;
  --sol:#8fb6ff; --pts:#ff8d7d; --gold:#e6b84a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#18221e; --ink:#e9f0eb; --muted:#9bada4; --line:#2c3a34;
  --accent:#35b88a; --on-accent:#05241a; --accent-soft:#1d3a30;
  --sol:#8fb6ff; --pts:#ff8d7d; --gold:#e6b84a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,3vw,2.1rem);line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.warn{border-color:var(--pts);color:var(--pts)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.team{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.team.lead{border-color:var(--gold)}
.team .nm{font-weight:700;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.team input{width:100%;font:inherit;font-weight:700;padding:2px 4px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.team .sc{font-family:var(--display);font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.adj{display:flex;gap:6px}
.adj button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 0;font-weight:700}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col h2{font-family:var(--display);font-weight:600;font-size:clamp(.7rem,1.5vw,1.05rem);margin:0;min-height:2.6em;display:flex;align-items:flex-end;line-height:1.15;overflow-wrap:anywhere}
.tile{position:relative;border:0;border-radius:8px;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:clamp(1rem,2.6vw,1.7rem);padding:clamp(8px,1.4vw,14px) 0;font-variant-numeric:tabular-nums}
.tile small{position:absolute;top:3px;left:6px;font-family:var(--body);font-weight:400;font-size:.65rem;opacity:.8}
.tile:hover{filter:brightness(1.1)}
.tile.used{background:var(--accent-soft);color:var(--muted);text-decoration:line-through}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.meta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.meta .tag{font-weight:700;color:var(--muted)}
.meta .pv{font-family:var(--display);font-weight:800;color:var(--pts);font-size:1.5rem}
.qtext{font-size:clamp(1.5rem,3.6vw,2.7rem);line-height:1.3;margin:0;text-wrap:pretty;overflow-wrap:anywhere}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pick button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 8px;font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pick button:disabled{cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{color:var(--muted);margin:0}
.solution{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:18px 20px;color:var(--sol);font-size:clamp(1.15rem,2.4vw,1.7rem);display:flex;flex-direction:column;gap:10px;overflow-x:auto}
.solution .ans{font-weight:700;border-bottom:1.5px solid var(--line);padding-bottom:10px}
.solution .err{color:var(--muted);font-style:italic;font-size:.8em;border-top:1.5px solid var(--line);padding-top:10px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rank li{display:flex;gap:16px;align-items:baseline;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 18px;font-size:clamp(1.2rem,3vw,2rem)}
.rank li.first{border-color:var(--gold)}
.rank .pos{font-family:var(--display);font-weight:800;color:var(--gold);min-width:2ch}
.rank .who{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.rank .tot{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
math{font-size:1.05em}
.setup{padding-top:12vh}
.setup form{gap:16px}
.setup label{flex-basis:100%}
#nteams{font:inherit;font-family:var(--display);font-weight:800;font-size:2.2rem;width:5ch;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-align:center}
.btn.big{font-size:1.3rem;padding:12px 22px}
.fig{color:var(--ink);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.fig svg{display:block;width:auto;max-width:100%;height:auto;max-height:52vh;background:var(--surface);border-radius:10px}
.solution .fig svg{max-height:46vh}
.fig table{border-collapse:collapse;background:var(--surface);font-size:clamp(1.2rem,2.8vw,2rem);font-variant-numeric:tabular-nums}
.fig .vt th,.fig .vt td{border:1.5px solid var(--line);padding:6px 18px;min-width:2.6em;text-align:center}
.fig .vt th{font-family:serif}
.fig .stem th,.fig .stem td{padding:4px 16px;text-align:left}
.fig .stem th{border-bottom:2px solid var(--ink)}
.fig .stem th:first-child,.fig .stem td:first-child{border-right:2px solid var(--ink);text-align:right}
.fig .key{margin:0;font-size:clamp(1rem,2vw,1.4rem);color:var(--muted)}
</style>
<div class="wrap">
  <header>
    <div>
      <h1>Semester 2 Exam Paper 2 Revision Game</h1>
      <p class="sub">Year 7 Mathematics. Calculator allowed. Pick a tile, answer on your whiteboard.</p>
    </div>
    <div class="tools">
      <button class="btn" id="undo">Undo last award</button>
      <button class="btn" id="adjust" aria-pressed="false">Adjust scores</button>
      <button class="btn primary" id="end">End game</button>
    </div>
  </header>
  <section class="scores" id="scores" aria-label="Scoreboard"></section>
  <section class="board" id="board" aria-label="Question board"></section>
</div>
<div class="sheet" id="qsheet" hidden><div class="in">
  <div class="meta"><span class="tag" id="qtag"></span><span class="pv" id="qpts"></span><button class="btn" id="back">Back to board</button></div>
  <p class="qtext" id="qtext"></p>
  <div class="fig" id="qfig" hidden></div>
  <p class="note" id="picknote"></p>
  <div class="pick" id="pick"></div>
  <div class="row">
    <button class="btn primary" id="award">Award points</button>
    <button class="btn" id="nowin">No winners</button>
    <button class="btn" id="redo" hidden>Change award</button>
    <button class="btn primary" id="showsol">Show solution</button>
  </div>
  <div class="solution" id="sol" hidden></div>
</div></div>
<div class="sheet" id="endsheet" hidden><div class="in">
  <div class="meta"><h1>Final ranking</h1><button class="btn" id="resume">Back to game</button></div>
  <ol class="rank" id="rank"></ol>
  <div class="row"><button class="btn warn" id="reset">Start a new game</button><span class="note" id="resetnote"></span></div>
</div></div>
<div class="sheet" id="setup" hidden><div class="in setup">
  <h1>Semester 2 Exam Paper 2 Revision Game</h1>
  <form id="setupform" class="row">
    <label for="nteams" class="qtext">How many teams are playing?</label>
    <input id="nteams" type="number" min="2" max="12" step="1" inputmode="numeric" required>
    <button class="btn primary big" type="submit">Start game</button>
  </form>
  <p class="note" id="setupnote" role="alert"></p>
</div></div>

<script>
const DATA = {"skills": ["Statistics", "Cartesian plane and transformations", "Algebra and equations", "Linear relationships and graphs", "Probability and ratio"], "qs": [{"skill": "Statistics", "pts": 10, "q": "Find the mode of: $4,\\ 9,\\ 2,\\ 9,\\ 5,\\ 4,\\ 9$", "ans": "Mode $= 9$", "sol": ["The mode is the score that occurs most often.", "9 occurs three times and 4 occurs twice.", "$\\text{Mode} = 9$"], "err": null, "n": 1}, {"skill": "Statistics", "pts": 10, "q": "Is the number of pets in a household numerical discrete, numerical continuous or categorical data?", "ans": "Numerical discrete", "sol": ["The data are numbers, so they are numerical.", "Pets are counted, so the values are whole numbers only.", "The data are numerical and discrete."], "err": "Choosing continuous. Continuous data are measured, such as rainfall or height.", "n": 2}, {"skill": "Statistics", "pts": 20, "q": "Find the mean of: $1.8,\\ 2.4,\\ 2.9,\\ 3.1,\\ 3.3$", "ans": "Mean $= 2.7$", "sol": ["There are 5 scores.", "$\\text{Sum} = 1.8 + 2.4 + 2.9 + 3.1 + 3.3$", "$= 13.5$", "$\\text{Mean} = \\dfrac{13.5}{5}$", "$= 2.7$"], "err": null, "n": 3}, {"skill": "Statistics", "pts": 20, "q": "The overnight temperatures, in degrees Celsius, were: ${-4.5},\\ 2,\\ {-1.5},\\ 6.5,\\ 0$. Find the range.", "ans": "Range $= 11\\,^\\circ\\text{C}$", "sol": ["Highest temperature is 6.5 and lowest temperature is ${-4.5}$.", "$\\text{Range} = 6.5 - ({-4.5})$", "$= 6.5 + 4.5$", "$= 11\\,^\\circ\\text{C}$"], "err": "Calculating $6.5 - 4.5 = 2$. Subtracting a negative is the same as adding.", "n": 4}, {"skill": "Statistics", "pts": 30, "q": "The stem-and-leaf plot shows the ages of people at a party. Find the median and the range.", "ans": "Median $= 23$, range $= 22$", "sol": ["The ages in order are 12, 15, 18, 20, 23, 23, 27, 31, 34.", "There are 9 ages, so the median is the 5th age.", "$\\text{Median} = 23$", "$\\text{Range} = 34 - 12$", "$= 22$"], "err": null, "n": 5, "fig": "<table class=\"stem\"><tr><th>Stem</th><th>Leaf</th></tr><tr><td>1</td><td>2&nbsp;&nbsp;5&nbsp;&nbsp;8</td></tr><tr><td>2</td><td>0&nbsp;&nbsp;3&nbsp;&nbsp;3&nbsp;&nbsp;7</td></tr><tr><td>3</td><td>1&nbsp;&nbsp;4</td></tr></table><p class=\"key\">Key: 2 | 3 = 23</p>"}, {"skill": "Statistics", "pts": 30, "q": "Find the mean of the temperatures: ${-2.5},\\ 1,\\ {-4},\\ 3.5,\\ {-0.5},\\ {-3.5}$", "ans": "Mean $= {-1}$", "sol": ["There are 6 scores.", "$\\text{Sum} = {-2.5} + 1 + ({-4}) + 3.5 + ({-0.5}) + ({-3.5})$", "$= {-6}$", "$\\text{Mean} = \\dfrac{-6}{6}$", "$= {-1}$"], "err": "Ignoring the negative signs. Add the positive values and the negative values separately: $4.5 + ({-10.5})$.", "n": 6}, {"skill": "Statistics", "pts": 40, "q": "Nine students have a mean test score of 70. A tenth student scores 50. Find the new mean and describe the change.", "ans": "New mean $= 68$; it decreases by 2", "sol": ["$\\text{Sum of nine scores} = 70 \\times 9$", "$= 630$", "$\\text{New sum} = 630 + 50$", "$= 680$", "$\\text{New mean} = \\dfrac{680}{10}$", "$= 68$", "The mean decreases by 2 because 50 is lower than the old mean."], "err": "Averaging 70 and 50 to get 60. The old mean represents nine students, not one.", "n": 7}, {"skill": "Statistics", "pts": 40, "q": "Find the mean of the data in the stem-and-leaf plot, correct to 2 decimal places.", "ans": "Mean $\\approx 52.71$", "sol": ["The data are 42, 46, 51, 51, 55, 60, 64, so there are 7 scores.", "$\\text{Sum} = 42 + 46 + 51 + 51 + 55 + 60 + 64$", "$= 369$", "$\\text{Mean} = \\dfrac{369}{7}$", "$= 52.714\\ldots$", "$\\approx 52.71$"], "err": "Counting the stems instead of the leaves. Each leaf is one score.", "n": 8, "fig": "<table class=\"stem\"><tr><th>Stem</th><th>Leaf</th></tr><tr><td>4</td><td>2&nbsp;&nbsp;6</td></tr><tr><td>5</td><td>1&nbsp;&nbsp;1&nbsp;&nbsp;5</td></tr><tr><td>6</td><td>0&nbsp;&nbsp;4</td></tr></table><p class=\"key\">Key: 4 | 2 = 42</p>"}, {"skill": "Statistics", "pts": 50, "q": "The minimum temperatures over six days were ${-3.5},\\ {-1},\\ 2,\\ x,\\ {-0.5},\\ 1$. The mean is ${-0.5}$. Find $x$, then find the median.", "ans": "$x = {-1}$, median $= {-\\dfrac{3}{4}}$ $(\\text{or } {-0.75})$", "sol": ["$\\text{Sum} = {-0.5} \\times 6$", "$= {-3}$", "$\\text{Sum of known values} = {-3.5} + ({-1}) + 2 + ({-0.5}) + 1$", "$= {-2}$", "$x = {-3} - ({-2})$", "$x = {-1}$", "In order: ${-3.5},\\ {-1},\\ \\mathbf{-1},\\ \\mathbf{-0.5},\\ 1,\\ 2$", "$\\text{Median} = \\dfrac{-1 + ({-0.5})}{2}$", "$= {-\\dfrac{3}{4}}$"], "err": "Ordering ${-0.5}$ before ${-1}$. ${-1}$ is further below zero, so it is smaller.", "n": 9}, {"skill": "Statistics", "pts": 50, "q": "The mean of 8 numbers is ${-\\dfrac{1}{2}}$. One of the numbers, 3, is removed. Find the mean of the remaining 7 numbers.", "ans": "Mean $= {-1}$", "sol": ["$\\text{Sum of 8 numbers} = {-\\dfrac{1}{2}} \\times 8$", "$= {-4}$", "$\\text{Sum of 7 numbers} = {-4} - 3$", "$= {-7}$", "$\\text{New mean} = \\dfrac{-7}{7}$", "$= {-1}$"], "err": "Calculating ${-4} - 3$ as ${-1}$. Subtracting 3 from ${-4}$ moves further below zero.", "n": 10}, {"skill": "Cartesian plane and transformations", "pts": 10, "q": "Which point on the graph is in the fourth quadrant?", "ans": "Point $D$", "sol": ["The fourth quadrant has positive $x$-values and negative $y$-values.", "$D$ is right of the $y$-axis and below the $x$-axis.", "Point $D$ is in the fourth quadrant."], "err": "Numbering the quadrants clockwise. They go anticlockwise, starting top right.", "n": 11, "fig": "<svg viewBox=\"0 0 432 420\" role=\"img\" aria-label=\"graph\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"inherit\"><line x1=\"46\" y1=\"40\" x2=\"46\" y2=\"380\" style=\"stroke:var(--line)\" stroke-width=\"1.3\"/><line x1=\"80\" y1=\"40\" x2=\"80\" y2=\"380\" style=\"stroke:var(--line)\" stroke-width=\"1.3\"/><line x1=\"114\" y1=\"40\" x2=\"114\" y2=\"380\" style=\"stroke:var(--line)\" stroke-width=\"1.3\"/><line x1=\"148\" y1=\"40\" x2=\"148\" y2=\"380\" style=\"stroke:var(--line)\" stroke-width= ill": "Algebra and equations", "pts": 20, "q": "Simplify $6x + 2y - 4x + 5y$.", "ans": "$2x + 7y$", "sol": ["Group the like terms.", "$6x - 4x + 2y + 5y$", "$= 2x + 7y$"], "err": "Adding unlike terms to get $9xy$.", "n": 23}, {"skill": "Algebra and equations", "pts": 20, "q": "State the first inverse operation to solve $7k - 4 = 24$, then solve the equation.", "ans": "Add 4 to both sides; $k = 4$", "sol": ["The last operation done to $k$ was ${-4}$, so add 4 to both sides first.", "$7k - 4 = 24$", "$7k = 28$", "$k = 4$"], "err": "Dividing by 7 first. Undo the operations in reverse order.", "n": 24}, {"skill": "Algebra and equations", "pts": 30, "q": "Show by substitution whether $x = {-2}$ is a solution of $3(x + 5) = 9$.", "ans": "Yes, $x = {-2}$ is a solution", "sol": ["Substitute $x = {-2}$ into the left-hand side.", "$\\text{LHS} = 3({-2} + 5)$", "$= 3 \\times 3$", "$= 9$", "The left-hand side equals the right-hand side, so $x = {-2}$ is a solution."], "err": "Calculating ${-2} + 5$ as ${-7}$ or 7. On a number line, start at ${-2}$ and move 5 right.", "n": 25}, {"skill": "Algebra and equations", "pts": 30, "q": "Solve $\\dfrac{2(a - 3)}{4} = {-5}$, showing the inverse operations.", "ans": "$a = {-7}$", "sol": ["Multiply both sides by 4, divide by 2, then add 3.", "$\\dfrac{2(a - 3)}{4} = {-5}$", "$2(a - 3) = {-20}$", "$a - 3 = {-10}$", "$a = {-7}$"], "err": "Calculating ${-10} + 3$ as ${-13}$. Adding 3 moves towards zero.", "n": 26}, {"skill": "Algebra and equations", "pts": 40, "q": "Simplify $\\dfrac{1}{2}x + 3y - \\dfrac{3}{2}x - 5y$.", "ans": "$-x - 2y$", "sol": ["Group the like terms.", "$\\dfrac{1}{2}x - \\dfrac{3}{2}x + 3y - 5y$", "$= {-\\dfrac{2}{2}}x - 2y$", "$= -x - 2y$"], "err": "Calculating $\\dfrac{1}{2} - \\dfrac{3}{2}$ as 1. The answer is negative because $\\dfrac{3}{2}$ is larger.", "n": 27}, {"skill": "Algebra and equations", "pts": 40, "q": "Solve $6x + 11 = 2$. Give your answer as a fraction in simplest form.", "ans": "$x = {-\\dfrac{3}{2}}$ $ $.", "ans": "$\\dfrac{5}{8}$", "sol": ["There are $8 - 3 = 5$ envelopes with no prize.", "$\\Pr(\\text{no prize}) = \\dfrac{5}{8}$"], "err": null, "n": 43}, {"skill": "Probability and ratio", "pts": 20, "q": "The length to width ratio of a garden bed is $4 : 7$. Is a bed measuring 20 m by 35 m in the same ratio? Show why.", "ans": "Yes", "sol": ["$20 : 35 = 5 \\times 4 : 5 \\times 7$", "$= 4 : 7$", "The ratios are equivalent, so the bed is in the same ratio."], "err": null, "n": 44}, {"skill": "Probability and ratio", "pts": 30, "q": "The angles of a triangle are in the ratio $2 : 3 : 4$. Find the size of the largest angle.", "ans": "$80^\\circ$", "sol": ["$\\text{Total parts} = 2 + 3 + 4$", "$= 9$", "$\\text{One part} = \\dfrac{180^\\circ}{9}$", "$= 20^\\circ$", "$\\text{Largest angle} = 4 \\times 20^\\circ$", "$= 80^\\circ$"], "err": "Dividing by 3, the number of angles, instead of 9, the number of parts.", "n": 45}, {"skill": "Probability and ratio", "pts": 30, "q": "A letter is chosen at random from the word PROBABILITY. Find $\\Pr(\\text{the letter is not B})$.", "ans": "$\\dfrac{9}{11}$", "sol": ["PROBABILITY has 11 letters, and 2 of them are B.", "$\\text{Letters that are not B} = 11 - 2$", "$= 9$", "$\\Pr(\\text{not B}) = \\dfrac{9}{11}$"], "err": null, "n": 46}, {"skill": "Probability and ratio", "pts": 40, "q": "The angles of a quadrilateral are in the ratio $1 : 2 : 3 : 4$. Find the size of the largest angle.", "ans": "$144^\\circ$", "sol": ["The angles of a quadrilateral add to $360^\\circ$.", "$\\text{Total parts} = 1 + 2 + 3 + 4$", "$= 10$", "$\\text{One part} = \\dfrac{360^\\circ}{10}$", "$= 36^\\circ$", "$\\text{Largest angle} = 4 \\times 36^\\circ$", "$= 144^\\circ$"], "err": "Using $180^\\circ$. That is the angle sum of a triangle.", "n": 47}, {"skill": "Probability and ratio", "pts": 40, "q": "A bag holds red and blue counters in the ratio $3 : 5$. One counter is chosen at random. Find $\\Pr(\\text{blue})$.", "ans": "$\\dfrac{5}{8}$", "sol": ["$\\ const KEY = "Year7_S2ExamPaper2_RevisionGame";
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function tex(m){
  try{ if(window.katex) return katex.renderToString(m,{output:"mathml",throwOnError:false}); }catch(e){}
  return "<span>"+esc(m)+"</span>";
}
function rich(s){ // text with $math$; \$ and \% are literal
  let out="", buf="", math=false;
  const flush=()=>{ out += math ? tex(buf) : esc(buf.replace(/\\\$/g,"$").replace(/\\%/g,"%").replace(/``/g,"\u201c").replace(/''/g,"\u201d")); buf=""; };
  for(let i=0;i<s.length;i++){
    if(s[i]==="\\" && s[i+1]==="$"){ buf+="\\$"; i++; }
    else if(s[i]==="$"){ flush(); math=!math; }
    else buf+=s[i];
  }
  flush(); return out;
}
function fresh(n){ return {names:Array.from({length:n},(_,i)=>"Team "+(i+1)), scores:Array(n).fill(0), used:{}, history:[]}; }
let S = null, cur = null, picked = new Set(), adjusting = false, armed = false;
function load(d){ if(d && Array.isArray(d.scores) && d.scores.length>=2 && Array.isArray(d.names) && d.names.length===d.scores.length) S = d; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function drawScores(){
  const max = Math.max(...S.scores);
  $("scores").innerHTML = S.names.map((n,i)=>`<div class="team${max>0&&S.scores[i]===max?" lead":""}">
    ${adjusting?`<input id="name${i}" data-name="${i}" value="${esc(n).replace(/"/g,"&quot;")}" aria-label="Team ${i+1} name">`:`<span class="nm">${esc(n)}</span>`}
    <span class="sc">${S.scores[i]}</span>
    ${adjusting?`<div class="adj"><button data-adj="${i}" data-d="-5" aria-label="Take 5 from ${esc(n)}">&minus;5</button><button data-adj="${i}" data-d="5" aria-label="Add 5 to ${esc(n)}">+5</button></div>`:""}
  </div>`).join("");
  $("undo").disabled = !S.history.length;
}
function drawBoard(){
  $("board").innerHTML = DATA.skills.map(sk=>`<div class="col">${
    DATA.qs.filter(q=>q.skill===sk).map(q=>`<button class="tile${S.used[q.n]?" used":""}" data-q="${q.n}" aria-label="Question ${q.n}, ${q.pts} points${S.used[q.n]?", used":""}"><small>${q.n}</small>${q.pts}</button>`).join("")
  }</div>`).join("");
}
function drawQ(){
  const q = cur, u = S.used[q.n];
  $("qtag").textContent = "Question "+q.n;
  $("qpts").textContent = q.pts+" points";
  $("qtext").innerHTML = rich(q.q);
  $("qfig").innerHTML = q.fig || ""; $("qfig").hidden = !q.fig;
  $("pick").innerHTML = S.names.map((n,i)=>`<button data-t="${i}" aria-pressed="${u?u.includes(i):picked.has(i)}"${u?" disabled":""}>${esc(n)}</button>`).join("");
  $("picknote").textContent = u ? (u.length ? "Points awarded to "+u.map(i=>S.names[i]).join(", ")+"." : "No winners for this question.") : "Select every team with a correct whiteboard, then award the points.";
  $("award").hidden = $("nowin").hidden = !!u;
  $("redo").hidden = !u;
}
function openQ(n){ cur = DATA.qs.find(q=>q.n===n); picked = new Set(); $("sol").hidden = true; drawQ(); $("qsheet").hidden = false; $("qsheet").scrollTop = 0; }
function award(w){ S.used[cur.n] = w; w.forEach(i=>S.scores[i]+=cur.pts); S.history.push(cur.n); save(); drawScores(); drawBoard(); drawQ(); }
function revoke(n){
  const q = DATA.qs.find(x=>x.n===n), w = S.used[n]; if(!w) return;
  w.forEach(i=>S.scores[i]-=q.pts); delete S.used[n]; S.history = S.history.filter(x=>x!==n);
  save(); drawScores(); drawBoard();
}
function showSol(){
  const q = cur;
  $("sol").innerHTML = `<div class="ans">Answer: ${rich(q.ans)}</div>` + q.sol.map(l=>`<div>${rich(l)}</div>`).join("") + (q.solfig?`<div class="fig">${q.solfig}</div>`:"") + (q.err?`<div class="err">Common error: ${rich(q.err)}</div>`:"");
  $("sol").hidden = false;
}
function drawRank(){
  const order = S.scores.map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s);
  let pos = 0, prev = null;
  $("rank").innerHTML = order.map((o,k)=>{ if(o.s!==prev){pos=k+1;prev=o.s;} return `<li class="${pos===1?"first":""}"><span class="pos">${pos}</span><span class="who">${esc(S.names[o.i])}</span><span class="tot">${o.s}</span></li>`; }).join("");
}
$("board").addEventListener("click",e=>{ const b=e.target.closest("[data-q]"); if(b) openQ(+b.dataset.q); });
$("pick").addEventListener("click",e=>{ const b=e.target.closest("[data-t]"); if(!b||b.disabled) return; const i=+b.dataset.t; picked.has(i)?picked.delete(i):picked.add(i); b.setAttribute("aria-pressed",picked.has(i)); });
$("award").onclick = ()=>{ if(!picked.size){ $("picknote").textContent="No team is selected. Select the winning teams, or choose No winners."; return; } award([...picked].sort((a,b)=>a-b)); };
$("nowin").onclick = ()=>award([]);
$("redo").onclick = ()=>{ revoke(cur.n); picked = new Set(); drawQ(); };
$("showsol").onclick = showSol;
$("back").onclick = ()=>{ $("qsheet").hidden = true; };
$("undo").onclick = ()=>{ if(S.history.length) revoke(S.history[S.history.length-1]); };
$("adjust").onclick = ()=>{ adjusting=!adjusting; $("adjust").setAttribute("aria-pressed",adjusting); $("adjust").textContent = adjusting?"Done adjusting":"Adjust scores"; drawScores(); };
$("scores").addEventListener("click",e=>{ const b=e.target.closest("[data-adj]"); if(!b) return; S.scores[+b.dataset.adj]+= +b.dataset.d; save(); drawScores(); });
$("scores").addEventListener("change",e=>{ const i=e.target.dataset.name; if(i===undefined) return; S.names[+i] = e.target.value.trim() || "Team "+(+i+1); save(); });
$("end").onclick = ()=>{ armed=false; $("reset").textContent="Start a new game"; $("resetnote").textContent=""; drawRank(); $("endsheet").hidden=false; };
$("resume").onclick = ()=>{ $("endsheet").hidden = true; };
$("reset").onclick = ()=>{
  if(!armed){ armed=true; $("reset").textContent="Yes, clear all scores"; $("resetnote").textContent="This clears every score and reopens all 50 tiles."; return; }
  S = null; try{ localStorage.removeItem(KEY); }catch(e){} $("endsheet").hidden = true; askTeams();
};
function askTeams(){ $("setupnote").textContent=""; $("setup").hidden = false; $("nteams").focus(); }
$("setupform").addEventListener("submit",e=>{
  e.preventDefault();
  const n = Number($("nteams").value);
  if(!Number.isInteger(n) || n<2 || n>12){ $("setupnote").textContent="Enter a whole number of teams from 2 to 12."; return; }
  S = fresh(n); save(); drawScores(); drawBoard(); $("setup").hidden = true;
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && S){ $("qsheet").hidden = true; $("endsheet").hidden = true; } });
function start(d){
  if(d && d.S) load(d.S); else { try{ load(JSON.parse(localStorage.getItem(KEY))); }catch(e){} }
  if(S){ drawScores(); drawBoard(); } else askTeams();
}
window.claude?.hot?.snapshot?.(()=>(S?{S}:{}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
