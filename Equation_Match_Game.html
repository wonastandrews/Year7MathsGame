<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equation Match — Word Problems to Equations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#123A66;
    --bg:#1E5390;
    --bg-light:#2E6BB0;
    --ink:#1B2A3A;
    --ink-soft:#5E738C;
    --teal:#1F6F6B;
    --teal-tint:#E9F3F2;
    --coral:#C9564A;
    --coral-tint:#FBECE9;
    --amber:#B9840F;
    --amber-tint:#FBF2DF;
    --card:#FFFFFF;
    --panel:#F3F6FA;
    --panel-line:#DCE5EF;
    --radius:3px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    background-image: radial-gradient(circle at 15% -10%, var(--bg-light) 0%, transparent 45%),
                       radial-gradient(circle at 100% 110%, var(--bg-deep) 0%, transparent 55%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  .wrap{
    max-width:700px;
    margin:0 auto;
    padding:38px 22px 70px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:2.5px solid rgba(255,255,255,0.35);
  }

  .title-block h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px, 5vw, 38px);
    line-height:1.05;
    margin:0 0 6px;
    letter-spacing:-0.01em;
    color:#FFFFFF;
  }

  .title-block h1 em{
    font-style:italic;
    color:#F5C452;
  }

  .title-block p{
    margin:0;
    font-size:14.5px;
    color:#C9DBEF;
    max-width:40ch;
  }

  .score-block{
    text-align:right;
    flex-shrink:0;
  }

  .score-block .num{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:30px;
    line-height:1;
    color:#F5C452;
  }

  .score-block .label{
    font-size:12px;
    color:#C9DBEF;
    margin-top:2px;
  }

  /* ---------- Progress ---------- */
  .progress{
    display:flex;
    gap:6px;
    margin-bottom:26px;
  }

  .progress .step{
    flex:1;
    height:6px;
    background:rgba(255,255,255,0.28);
    border-radius:1px;
    position:relative;
    overflow:hidden;
  }

  .progress .step.current{ background:#DCE8F5; }
  .progress .step.correct{ background:var(--amber); }
  .progress .step.wrong{ background:var(--coral); }

  /* ---------- Jump-to-question panel ---------- */
  .jump-wrap{
    margin-bottom:22px;
  }

  .jump-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.12);
    border:1.5px solid rgba(255,255,255,0.35);
    color:#EAF1FA;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border-radius:2px;
    cursor:pointer;
  }
  .jump-toggle:hover{ background:rgba(255,255,255,0.2); }
  .jump-toggle:focus-visible{ outline:3px solid #F5C452; outline-offset:2px; }

  .jump-toggle .chev{
    display:inline-block;
    font-size:11px;
    transition:transform 0.15s ease;
  }
  .jump-toggle.open .chev{ transform:rotate(180deg); }

  .jump-grid{
    display:none;
    grid-template-columns:repeat(10, 1fr);
    gap:8px;
    margin-top:12px;
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:var(--radius);
    padding:14px;
    box-shadow: 4px 4px 0 rgba(35,48,44,0.08);
  }
  .jump-grid.show{ display:grid; }

  .jump-num{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    font-weight:600;
    border:1.5px solid var(--panel-line);
    background:var(--panel);
    color:var(--ink);
    border-radius:2px;
    cursor:pointer;
  }
  .jump-num:hover{ border-color:var(--ink); }
  .jump-num:focus-visible{ outline:2.5px solid var(--teal); outline-offset:1px; }

  .jump-num.jc{ background:var(--amber-tint); border-color:var(--amber); color:var(--amber); }
  .jump-num.jw{ background:var(--coral-tint); border-color:var(--coral); color:var(--coral); }
  .jump-num.jcur{ border-color:var(--teal); border-width:2.5px; }

  @media (max-width:520px){
    .jump-grid{ grid-template-columns:repeat(6, 1fr); }
  }

  /* ---------- Card ---------- */
  .card{
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:var(--radius);
    padding:30px 30px 26px;
    box-shadow: 5px 5px 0 rgba(35,48,44,0.08);
  }

  .qmeta{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:14px;
  }

  .qmeta .qnum{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    color:var(--teal);
    letter-spacing:0.02em;
  }

  .hint-toggle{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:13px;
    font-family:'Inter',sans-serif;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    padding:2px;
  }

  .hint-toggle:hover{ color:var(--ink); }

  .hint-box{
    display:none;
    background:var(--teal-tint);
    border-left:3px solid var(--teal);
    padding:10px 14px;
    font-size:13.5px;
    color:var(--ink);
    margin-bottom:16px;
    border-radius:0 3px 3px 0;
  }
  .hint-box.show{ display:block; }

  .prompt{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:19px;
    line-height:1.45;
    margin:0 0 22px;
    color:var(--ink);
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .opt{
    display:flex;
    align-items:flex-start;
    gap:14px;
    width:100%;
    text-align:left;
    background:var(--panel);
    border:1.5px solid var(--panel-line);
    border-radius:2px;
    padding:12px 14px;
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    line-height:1.55;
    color:var(--ink);
    transition:border-color 0.12s ease, background 0.12s ease, transform 0.08s ease;
  }

  .opt:hover:not(:disabled){
    border-color:var(--ink);
    transform:translateX(2px);
  }

  .opt:focus-visible{
    outline:3px solid var(--teal);
    outline-offset:2px;
  }

  .opt .letter{
    flex-shrink:0;
    width:26px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1.5px solid var(--ink);
    border-radius:50%;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:12.5px;
    color:var(--ink);
    background:#fff;
  }

  .opt .text{ flex:1; padding-top:2px; }

  .opt:disabled{ cursor:default; }

  .opt.is-correct{
    background:var(--amber-tint);
    border-color:var(--amber);
  }
  .opt.is-correct .letter{
    background:var(--amber);
    border-color:var(--amber);
    color:#fff;
  }

  .opt.is-wrong{
    background:var(--coral-tint);
    border-color:var(--coral);
  }
  .opt.is-wrong .letter{
    background:var(--coral);
    border-color:var(--coral);
    color:#fff;
  }

  .opt.is-dim{ opacity:0.5; }

  /* ---------- Feedback ---------- */
  .feedback{
    display:none;
    margin-top:20px;
    padding:16px 18px;
    border-radius:2px;
    font-size:14.5px;
    line-height:1.6;
  }
  .feedback.show{ display:block; }
  .feedback.correct{ background:var(--amber-tint); border-left:3px solid var(--amber); }
  .feedback.wrong{ background:var(--coral-tint); border-left:3px solid var(--coral); }

  .feedback .verdict{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16px;
    margin:0 0 6px;
  }
  .feedback.correct .verdict{ color:var(--amber); }
  .feedback.wrong .verdict{ color:var(--coral); }

  .feedback p{ margin:0; color:var(--ink); }

  .actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
  }

  .btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    padding:11px 22px;
    border-radius:2px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
    display:none;
  }
  .btn.show{ display:inline-block; }
  .btn:hover{ background:#3a4a45; }
  .btn:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }

  .btn.secondary{
    background:#fff;
    color:var(--ink);
  }
  .btn.secondary:hover:not(:disabled){ background:var(--panel); }
  .btn.secondary:disabled{
    opacity:0.35;
    cursor:default;
  }

  /* ---------- Summary screen ---------- */
  .summary{
    display:none;
    text-align:center;
    padding:20px 10px 6px;
  }
  .summary.show{ display:block; }

  .summary .big{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:52px;
    color:var(--teal);
    line-height:1;
    margin:6px 0 4px;
  }

  .summary .verdict-line{
    font-size:15px;
    color:var(--ink-soft);
    margin-bottom:22px;
  }

  .result-row{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    padding:9px 4px;
    border-bottom:1px solid var(--panel-line);
    font-size:13.5px;
  }
  .result-row:last-child{ border-bottom:none; }

  .result-row .mark{
    width:22px; height:22px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:12px;
    font-weight:700;
    font-family:'Inter',sans-serif;
  }
  .result-row .mark.ok{ background:var(--amber); }
  .result-row .mark.no{ background:var(--coral); }

  .result-row .rtext{ color:var(--ink-soft); flex:1; }

  footer{
    text-align:center;
    margin-top:30px;
    font-size:12.5px;
    color:#B7CDE6;
  }

  @media (max-width:520px){
    .card{ padding:22px 18px 20px; }
    header{ flex-direction:column; align-items:flex-start; gap:6px; }
    .score-block{ text-align:left; }
    .prompt{ font-size:17.5px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="title-block">
      <h1>Equation <em>Match</em></h1>
      <p>Read the word problem. Pick the option that defines the variable <em>and</em> forms the matching equation.</p>
    </div>
    <div class="score-block">
      <div class="num" id="scoreNum">0/8</div>
      <div class="label">correct</div>
    </div>
  </header>

  <div class="progress" id="progress"></div>

  <div class="jump-wrap">
    <button class="jump-toggle" id="jumpToggle">
      <span>Jump to question</span>
      <span class="chev" id="jumpChev">&#9662;</span>
    </button>
    <div class="jump-grid" id="jumpGrid"></div>
  </div>

  <div class="card" id="quizCard">
    <div class="qmeta">
      <span class="qnum" id="qnumLabel">Question 1 of 8</span>
      <button class="hint-toggle" id="hintToggle">Need a hint?</button>
    </div>

    <div class="hint-box" id="hintBox"></div>

    <p class="prompt" id="promptText"></p>

    <div class="options" id="optionsWrap"></div>

    <div class="feedback" id="feedback">
      <p class="verdict" id="verdictText"></p>
      <p id="explainText"></p>
    </div>

    <div class="actions">
      <button class="btn secondary show" id="backBtn">← Previous</button>
      <button class="btn" id="nextBtn">Next question →</button>
    </div>
  </div>

  <div class="card summary" id="summaryCard">
    <div style="font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink-soft); letter-spacing:0.03em;">GAME OVER</div>
    <div class="big" id="finalScore">0/8</div>
    <div class="verdict-line" id="finalVerdict"></div>
    <div id="resultsList" style="max-width:440px; margin:0 auto 22px; text-align:left;"></div>
    <button class="btn show" id="restartBtn" style="display:inline-block;">Play again</button>
  </div>

  <footer>Year 7 Algebra &middot; Forming equations from worded questions</footer>

</div>

<script>
const QUESTIONS = [
  {
    prompt: "Six more than three times a number is 27. Which option correctly defines the variable and forms the equation?",
    hint: "\u201cThree times a number\u201d is 3n. \u201cSix more than\u201d that means you add 6 to it.",
    options: [
      "Let n be the number. 3n \u2212 6 = 27",
      "Let n be the number. 3n + 6 = 27",
      "Let n be the number. 3(n + 6) = 27",
      "Let n be the number. 6n + 3 = 27"
    ],
    correct: 1,
    explain: "\u201cThree times a number\u201d is 3n. \u201cSix more than\u201d that quantity means add 6: 3n + 6. This equals 27, giving 3n + 6 = 27. Watch out for common mistakes: adding 6 to n before tripling, swapping which number gets tripled, or subtracting instead of adding."
  },
  {
    prompt: "A taxi charges a $4 flag-fall plus $2.20 per kilometre. A trip costs $26.80. Which option correctly defines the variable and forms the equation?",
    hint: "The flag-fall is a flat fee added once, not multiplied by distance.",
    options: [
      "Let k km be the distance. 2.20(k + 4) = 26.80",
      "Let k km be the distance. 4k + 2.20 = 26.80",
      "Let k km be the distance. 2.20k \u2212 4 = 26.80",
      "Let k km be the distance. 2.20k + 4 = 26.80"
    ],
    correct: 3,
    explain: "The per-km rate multiplies the distance (2.20k) and the flat $4 flag-fall is added on top, giving 2.20k + 4 = 26.80. Watch out for common mistakes: multiplying distance by the flag-fall instead of the rate, adding the flag-fall inside the distance before multiplying, or subtracting the flag-fall instead of adding it."
  },
  {
    prompt: "Sarah is 5 years older than twice her brother's age. Sarah is 21. Which option correctly defines the variable and forms the equation for her brother's age?",
    hint: "\u201cTwice her brother's age\u201d is 2b. \u201c5 years older than\u201d that means add 5.",
    options: [
      "Let b years be the brother's age. 5b + 2 = 21",
      "Let b years be the brother's age. b + 5 = 2(21)",
      "Let b years be the brother's age. 2(b + 5) = 21",
      "Let b years be the brother's age. 2b + 5 = 21"
    ],
    correct: 3,
    explain: "\u201cTwice her brother's age\u201d is 2b, and Sarah's age is 5 more than that: 2b + 5. Since Sarah is 21, the equation is 2b + 5 = 21. Watch out for common mistakes: doubling (b+5) instead of just b, doubling Sarah's age instead of the brother's, or swapping the coefficient and the added amount."
  },
  {
    prompt: "A rectangular garden has a perimeter of 46 m. The length is 3 m more than the width. Which option correctly defines the variable and forms the equation for the width?",
    hint: "Perimeter = 2 \u00d7 (length + width). The length is w + 3.",
    options: [
      "Let w m be the width. 2w + 3 = 46",
      "Let w m be the width. w + (w + 3) = 46",
      "Let w m be the width. 2(w + (w + 3)) = 46",
      "Let w m be the width. 2(w + 3) = 46"
    ],
    correct: 2,
    explain: "Perimeter = 2 \u00d7 (length + width). With length = w + 3, this gives 2(w + (w+3)) = 46. Watch out for common mistakes: doubling only the width instead of the whole sum, forgetting to double the sum entirely, or doubling only the length expression while ignoring the width term."
  },
  {
    prompt: "Concert tickets cost $18 each, plus a single $6 booking fee per order (not per ticket). Which option correctly defines the variable and forms the equation for the total cost, C, of an order of n tickets?",
    hint: "The booking fee is charged once per order, not once per ticket.",
    options: [
      "Let n tickets be the number bought. C = 6n + 18",
      "Let n tickets be the number bought. C = 18n \u2212 6",
      "Let n tickets be the number bought. C = 18(n + 6)",
      "Let n tickets be the number bought. C = 18n + 6"
    ],
    correct: 3,
    explain: "Each ticket costs $18, so n tickets cost 18n, and the flat $6 fee is added once: C = 18n + 6. Watch out for common mistakes: adding the fee to the ticket count before multiplying, swapping which amount is per-ticket, or subtracting the fee instead of adding it."
  },
  {
    prompt: "A number is doubled, then decreased by 9. This gives the same result as adding 15 to the number. Which option correctly defines the variable and forms the equation?",
    hint: "\u201cDoubled\u201d applies to the number alone, not to (number \u2212 9).",
    options: [
      "Let x be the number. x \u2212 9 = 2x + 15",
      "Let x be the number. 2(x \u2212 9) = x + 15",
      "Let x be the number. 2x \u2212 9 = x + 15",
      "Let x be the number. 2x + 9 = x + 15"
    ],
    correct: 2,
    explain: "\u201cA number is doubled\u201d is 2x, then \u201cdecreased by 9\u201d gives 2x \u2212 9. This equals \u201cthe number increased by 15\u201d, which is x + 15. So 2x \u2212 9 = x + 15. Watch out for common mistakes: using + instead of \u2212 for \u201cdecreased\u201d, doubling (x \u2212 9) instead of just x, or swapping the two sides' structure."
  },
  {
    prompt: "Jake earns a base wage of $120 per day, plus a $15 bonus for every item he sells. Which option correctly defines the variable and forms the equation for the number of items, i, he must sell to earn $255 in a day?",
    hint: "The bonus is per item sold, so it's multiplied by i \u2014 the base wage is a flat amount.",
    options: [
      "Let i items be the number sold. 120i + 15 = 255",
      "Let i items be the number sold. 120 \u2212 15i = 255",
      "Let i items be the number sold. 15 + 120i = 255",
      "Let i items be the number sold. 120 + 15i = 255"
    ],
    correct: 3,
    explain: "The base wage ($120) is fixed, and the bonus ($15) is earned per item, so the bonus term is 15i: 120 + 15i = 255. Watch out for common mistakes: multiplying the wrong amount by i, or subtracting the bonus instead of adding it."
  },
  {
    prompt: "The sum of three consecutive integers is 72. Which option correctly defines the variable and forms the equation for the smallest integer?",
    hint: "Consecutive integers go up by 1 each time, e.g. n, n+1, n+2.",
    options: [
      "Let n be the smallest integer. 3(n + 1) = 72",
      "Let n be the smallest integer. n + (n + 2) + (n + 4) = 72",
      "Let n be the smallest integer. 3n + 1 = 72",
      "Let n be the smallest integer. n + (n + 1) + (n + 2) = 72"
    ],
    correct: 3,
    explain: "Consecutive integers increase by 1 each time: n, n+1, n+2. Their sum is n + (n+1) + (n+2) = 72. Watch out for common mistakes: using steps of 2 (that would be consecutive even/odd integers), or using a shortcut form that doesn't come directly from the wording."
  },
  {
    prompt: "A plumber charges a $50 call-out fee plus $35 per hour worked. A job costs $190 in total. Which option correctly defines the variable and forms the equation?",
    hint: "The call-out fee is a flat amount added once, not multiplied by the hours.",
    options: [
      "Let h hours be the time worked. 35(h + 50) = 190",
      "Let h hours be the time worked. 50h + 35 = 190",
      "Let h hours be the time worked. 35h + 50 = 190",
      "Let h hours be the time worked. 35h \u2212 50 = 190"
    ],
    correct: 2,
    explain: "The hourly rate multiplies the hours worked (35h), and the flat $50 call-out fee is added once: 35h + 50 = 190. Watch out for common mistakes: multiplying hours by the wrong amount, adding the fee inside the hours before multiplying, or subtracting the fee instead of adding it."
  },
  {
    prompt: "The sum of a number and 12 equals three times the number. Which option correctly defines the variable and forms the equation?",
    hint: "\u201cThe sum of a number and 12\u201d is n + 12. \u201cThree times the number\u201d is 3n.",
    options: [
      "Let n be the number. n + 12 = 3n",
      "Let n be the number. n \u2212 12 = 3n",
      "Let n be the number. n + 12 = 3 + n",
      "Let n be the number. 3n + 12 = n"
    ],
    correct: 0,
    explain: "\u201cThe sum of a number and 12\u201d is n + 12, and this equals \u201cthree times the number\u201d, which is 3n: n + 12 = 3n. Watch out for common mistakes: putting the 12 on the wrong side, replacing \u201cthree times\u201d with \u201cplus three\u201d, or subtracting instead of adding."
  },
  {
    prompt: "Liam is 4 years younger than his sister. The sum of their ages is 30. Which option correctly defines the variable and forms the equation for Liam's age?",
    hint: "If Liam is 4 years younger, his sister's age is Liam's age plus 4.",
    options: [
      "Let l years be Liam's age. l + (l \u2212 4) = 30",
      "Let l years be Liam's age. l + (l + 4) = 30",
      "Let l years be Liam's age. l \u00d7 (l + 4) = 30",
      "Let l years be Liam's age. 4l + 1 = 30"
    ],
    correct: 1,
    explain: "Liam is 4 years younger than his sister, so his sister's age is l + 4. Their ages sum to 30: l + (l + 4) = 30. Watch out for common mistakes: making Liam older than his sister instead of younger, writing an equation that isn't built from the wording at all, or multiplying the ages instead of adding them."
  },
  {
    prompt: "A jacket's price after a $15 discount is $64. Which option correctly defines the variable and forms the equation for the original price, p?",
    hint: "The discount is subtracted from the original price to get the sale price.",
    options: [
      "Let p dollars be the original price. p + 15 = 64",
      "Let p dollars be the original price. p \u2212 15 = 64",
      "Let p dollars be the original price. 15p = 64",
      "Let p dollars be the original price. 15 \u2212 p = 64"
    ],
    correct: 1,
    explain: "The discount is taken off the original price to leave the sale price: p \u2212 15 = 64. Watch out for common mistakes: adding the discount instead of subtracting it, swapping which term is subtracted from which, or multiplying instead of subtracting."
  },

function buildProgress(){
  progressEl.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const step = document.createElement('div');
    step.className = 'step';
    step.id = 'step-' + i;
    progressEl.appendChild(step);
  });
}

function updateProgressStep(i, state){
  const el = document.getElementById('step-' + i);
  if(!el) return;
  el.classList.remove('current','correct','wrong');
  if(state) el.classList.add(state);
}

function buildJumpGrid(){
  jumpGrid.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = 'jump-num';
    btn.id = 'jump-' + i;
    btn.textContent = (i + 1);
    btn.addEventListener('click', () => {
      current = i;
      renderQuestion();
      jumpGrid.classList.remove('show');
      jumpToggle.classList.remove('open');
    });
    jumpGrid.appendChild(btn);
  });
}

function updateJumpGrid(){
  QUESTIONS.forEach((_, i) => {
    const el = document.getElementById('jump-' + i);
    if(!el) return;
    el.classList.remove('jc','jw','jcur');
    if(results[i] === true) el.classList.add('jc');
    else if(results[i] === false) el.classList.add('jw');
    if(i === current) el.classList.add('jcur');
  });
}

jumpToggle.addEventListener('click', () => {
  jumpGrid.classList.toggle('show');
  jumpToggle.classList.toggle('open');
});

function letterFor(i){ return String.fromCharCode(65 + i); }

function renderQuestion(){
  const q = QUESTIONS[current];
  qnumLabel.textContent = 'Question ' + (current + 1) + ' of ' + QUESTIONS.length;
  promptText.textContent = q.prompt;
  hintBox.textContent = q.hint;
  hintBox.classList.remove('show');
  hintToggle.textContent = 'Need a hint?';
  feedback.classList.remove('show','correct','wrong');
  nextBtn.classList.remove('show');

  backBtn.disabled = (current === 0);

  optionsWrap.innerHTML = '';
  q.options.forEach((optText, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="letter">' + letterFor(i) + '</span><span class="text"></span>';
    btn.querySelector('.text').textContent = optText;
    btn.addEventListener('click', () => selectOption(i));
    optionsWrap.appendChild(btn);
  });

  const priorAnswer = userAnswers[current];
  if(priorAnswer !== null){
    // question already answered — restore its state instead of a blank slate
    showAnsweredState(priorAnswer, false);
  } else {
    updateProgressStep(current, 'current');
  }
  updateJumpGrid();
}

function showAnsweredState(selectedIdx, isNewAnswer){
  const q = QUESTIONS[current];
  const isCorrect = (selectedIdx === q.correct);
  const optButtons = optionsWrap.querySelectorAll('.opt');

  optButtons.forEach((btn, idx) => {
    btn.disabled = true;
    btn.classList.remove('is-correct','is-wrong','is-dim');
    if(idx === q.correct){ btn.classList.add('is-correct'); }
    else if(idx === selectedIdx){ btn.classList.add('is-wrong'); }
    else { btn.classList.add('is-dim'); }
  });

  feedback.classList.add('show');
  feedback.classList.add(isCorrect ? 'correct' : 'wrong');
  verdictText.textContent = isCorrect ? 'Correct!' : 'Not quite.';
  explainText.textContent = q.explain;

  updateProgressStep(current, isCorrect ? 'correct' : 'wrong');
  updateJumpGrid();

  nextBtn.classList.add('show');
  nextBtn.textContent = (current === QUESTIONS.length - 1) ? 'See results →' : 'Next question →';
}

function selectOption(i){
  if(userAnswers[current] !== null) return; // already answered, no re-answering
  const q = QUESTIONS[current];
  const isCorrect = (i === q.correct);

  userAnswers[current] = i;
  results[current] = isCorrect;
  if(isCorrect) score++;
  scoreNumEl.textContent = score + '/' + QUESTIONS.length;

  showAnsweredState(i, true);
}

hintToggle.addEventListener('click', () => {
  hintBox.classList.toggle('show');
  hintToggle.textContent = hintBox.classList.contains('show') ? 'Hide hint' : 'Need a hint?';
});

backBtn.addEventListener('click', () => {
  if(current > 0){
    current--;
    renderQuestion();
  }
});

nextBtn.addEventListener('click', () => {
  if(current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
  } else {
    showSummary();
  }
});

function showSummary(){
  quizCard.style.display = 'none';
  summaryCard.classList.add('show');
  document.getElementById('finalScore').textContent = score + '/' + QUESTIONS.length;

  let verdict;
  const pct = score / QUESTIONS.length;
  if(pct === 1) verdict = "Perfect score \u2014 every equation nailed.";
  else if(pct >= 0.75) verdict = "Strong work \u2014 you're reading these translations closely.";
  else if(pct >= 0.5) verdict = "Solid start \u2014 revisit the ones you missed.";
  else verdict = "Worth another pass \u2014 focus on what each phrase adds to the equation.";
  document.getElementById('finalVerdict').textContent = verdict;

  const list = document.getElementById('resultsList');
  list.innerHTML = '';
  results.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'result-row';
    row.innerHTML =
      '<span class="mark ' + (r ? 'ok' : 'no') + '">' + (r ? '\u2713' : '\u2717') + '</span>' +
      '<span class="rtext">Question ' + (i+1) + ' — ' + (r ? 'Correct' : 'Incorrect') + '</span>';
    list.appendChild(row);
  });
}

document.getElementById('restartBtn').addEventListener('click', () => {
  current = 0; score = 0;
  results = new Array(QUESTIONS.length).fill(null);
  userAnswers = new Array(QUESTIONS.length).fill(null);
  scoreNumEl.textContent = '0/' + QUESTIONS.length;
  summaryCard.classList.remove('show');
  quizCard.style.display = '';
  buildProgress();
  buildJumpGrid();
  renderQuestion();
});

buildProgress();
buildJumpGrid();
scoreNumEl.textContent = '0/' + QUESTIONS.length;
renderQuestion();
</script>

</body>
</html>
